name: EnthusiaDonors
version: '${project.version}'
main: com.enthusia.donors.EnthusiaDonorsPlugin
api-version: '1.21'
author: Enthusia
description: Isolated donor GUI and broadcast test build. NOT a production donor processor.
libraries:
  - org.xerial:sqlite-jdbc:3.49.1.0
  - com.google.code.gson:gson:2.11.0
commands:
  enthusiadonors:
    description: EnthusiaDonors sandbox administration.
    usage: /enthusiadonors test menu
    aliases: [edonors]
    permission: enthusiadonors.test
  donors:
    description: View test donor leaderboards, gifts and profiles.
    usage: /donors [monthly|alltime|me|profile|directory|glorious]
    permission: enthusiadonors.view
permissions:
  enthusiadonors.view:
    description: View public-safe sandbox donor menus.
    default: true
  enthusiadonors.test:
    description: Simulate and manage isolated test donations. Never grant to normal players.
    default: op
  enthusiadonors.admin:
    default: op
    children:
      enthusiadonors.test: true
      enthusiadonors.view: true
