name: EnthusiaDonors
version: '${project.version}'
main: com.enthusia.donors.EnthusiaDonorsPlugin
api-version: '1.21'
author: Enthusia
description: Official Tebex donor displays and opt-in payment announcements with isolated test controls. Does not grant donation entitlements.
softdepend: [PlaceholderAPI]
libraries:
  - org.mariadb.jdbc:mariadb-java-client:3.4.1
  - org.xerial:sqlite-jdbc:3.49.1.0
  - com.google.code.gson:gson:2.11.0
commands:
  enthusiadonors:
    description: EnthusiaDonors sandbox administration.
    usage: /enthusiadonors test menu
    aliases: [edonors]
    permission: enthusiadonors.test
  donors:
    description: View official Tebex donor leaderboards and public profiles.
    usage: /donors [monthly|alltime|me|profile|directory|glorious]
    permission: enthusiadonors.view
permissions:
  enthusiadonors.view:
    description: View public-safe official Tebex donor menus.
    default: true
  enthusiadonors.test:
    description: Simulate and manage isolated test donations. Never grant to normal players.
    default: op
  enthusiadonors.admin:
    default: op
    children:
      enthusiadonors.test: true
      enthusiadonors.view: true
